<!DOCTYPE html>
<html>
<head>
  <title>Maut App Store</title>
</head>
<body style="font-family:sans-serif; padding:20px;">

<h2>🔥 Maut App Store</h2>

<div id="apps">Loading...</div>

<script>
async function loadApps() {
  const container = document.getElementById("apps");

  try {
    const res = await fetch("https://dapper-kulfi-0015f5.netlify.app/.netlify/functions/apps");
    const json = await res.json();

    console.log(json);

    if (!json.data) {
      container.innerHTML = "❌ No data found";
      return;
    }

    let html = "";

    json.data.forEach(app => {
      html += `
        <div style="border:1px solid #ccc; padding:10px; margin:10px;">
          <img src="${app.icon}" width="60"><br>
          <b>${app.name}</b><br>
          ${app.description}<br>
          <a href="${app.file}" target="_blank">Download</a>
        </div>
      `;
    });

    container.innerHTML = html;

  } catch (err) {
    console.error(err);
    container.innerHTML = "❌ Error loading apps";
  }
}

loadApps();
</script>

</body>
</html>
