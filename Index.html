<!DOCTYPE html>
<html>
<head>
  <title>API Debug Test</title>
</head>
<body style="font-family:sans-serif; padding:20px;">

<h2>🔥 API Debug Test</h2>
<button onclick="testAPI()">Test API</button>

<pre id="output">Click button...</pre>

<script>
async function testAPI() {
  const out = document.getElementById("output");
  out.innerText = "Loading...";

  try {
    const res = await fetch("https://dapper-kulfi-0015f5.netlify.app/.netlify/functions/apps");

    out.innerText += "\nStatus: " + res.status;

    const text = await res.text(); // 👈 raw response

    out.innerText += "\n\nRAW RESPONSE:\n" + text;

  } catch (err) {
    out.innerText = "❌ ERROR:\n" + err;
    console.error(err);
  }
}
</script>

</body>
</html>
